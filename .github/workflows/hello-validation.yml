name: Hello baseline validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python syntax
        run: python3 -m compileall -q scripts
      - name: Smoke runner failure and cleanup tests
        run: python3 -m unittest discover -s tests -v
