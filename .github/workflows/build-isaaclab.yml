name: Build Isaac Lab training image
# Isaac Sim 5.1.0 + Isaac Lab v2.3.2 + robot_controller -> ghcr.io/khoadang-dinh/robot-sim-isaaclab.
#
# The image is tens of GB. Default runner: GitHub-hosted ubuntu-latest after freeing
# disk. If that is not enough, set the repository variable ISAACLAB_BUILD_RUNNER to a
# JSON runner label list for a bigger runner, e.g. ["self-hosted","linux","x64","builder"]
# (use a builder without production credentials).
# NGC: if nvcr.io requires login for the base image, add secret NGC_API_KEY.
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'containers/Dockerfile.isaaclab'
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/build-isaaclab.yml'
permissions:
  contents: read
concurrency:
  group: build-isaaclab-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/khoadang-dinh/robot-sim-isaaclab
jobs:
  build:
    runs-on: ${{ fromJSON(vars.ISAACLAB_BUILD_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space (GitHub-hosted runners)
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift || true
          docker system prune -af || true
          df -h /
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Log in to NGC (optional)
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        if: env.NGC_API_KEY != ''
        run: echo "$NGC_API_KEY" | docker login nvcr.io -u '$oauthtoken' --password-stdin
      - name: Build
        run: |
          docker build -f containers/Dockerfile.isaaclab \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "local/isaaclab:${GITHUB_SHA}" .
          docker image ls "local/isaaclab:${GITHUB_SHA}"
      - name: Smoke check (no GPU needed)
        run: |
          docker run --rm --entrypoint /isaac-sim/python.sh "local/isaaclab:${GITHUB_SHA}" -c \
            "import importlib.metadata as m; print({p: m.version(p) for p in ('isaaclab', 'rsl-rl-lib', 'robot-controller')})"
          docker run --rm -e ACCEPT_EULA=Y "local/isaaclab:${GITHUB_SHA}" validate /app/experiments/ur10-reach-ppo.yaml
      - name: Install pinned, checksum-verified Trivy
        run: bash scripts/install_trivy.sh
      - name: Trivy image report (informational)
        # NVIDIA's base image carries CVEs we cannot patch here; report, do not gate.
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --timeout 30m \
            --format table --exit-code 0 "local/isaaclab:${GITHUB_SHA}" | tail -n 60 >> "$GITHUB_STEP_SUMMARY"
      - name: Push to GHCR
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag "local/isaaclab:${GITHUB_SHA}" "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:${GITHUB_SHA}"
          DIGEST="$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:${GITHUB_SHA}" | grep "^$IMAGE@" | cut -d@ -f2)"
          echo "$DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
          echo "Deploy pinned image: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
