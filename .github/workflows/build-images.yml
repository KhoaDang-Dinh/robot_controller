name: Build and publish workload images
# Builds ONE application image on a GitHub-hosted runner (no AWS or admin
# credentials on the build host), gates on a Trivy scan, pushes it under every
# name in config/images.json that robot_controller owns, and records the
# immutable digest plus an SBOM. Deploy only the printed digest.
on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'experiments/smoke-resume.yaml'   # baked in as the image default
      - 'pyproject.toml'
      - 'uv.lock'
      - 'containers/**'
      - 'config/images.json'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve image names from config/images.json
        run: |
          python3 - <<'PY'
          import json, os
          config = json.load(open("config/images.json"))
          registry = config["registry"]
          assert registry == registry.lower(), "GHCR names must be lowercase"
          # The CPU application image only; Isaac Lab and ROS 2 images have their own workflows.
          ours = {n: s for n, s in config["images"].items()
                  if s["owner"] == "robot_controller" and s.get("dockerfile") == "containers/Dockerfile.app"}
          dockerfiles = {s["dockerfile"] for s in ours.values()}
          assert len(dockerfiles) == 1, "expected one application image"
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"DOCKERFILE={dockerfiles.pop()}\n")
              env.write(f"IMAGES={' '.join(f'{registry}/{n}' for n in sorted(ours))}\n")
          PY
      - name: Install pinned, checksum-verified Trivy
        run: bash scripts/install_trivy.sh
      - name: Build
        run: |
          docker build --pull -f "$DOCKERFILE" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "local/app:${GITHUB_SHA}" .
          docker run --rm --read-only "local/app:${GITHUB_SHA}" validate /app/experiments/smoke-resume.yaml
      - name: Trivy gate (fixable HIGH/CRITICAL)
        run: |
          trivy image --scanners vuln,secret --ignorefile .trivyignore \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "local/app:${GITHUB_SHA}"
      - name: Push to GHCR under every owned name
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          for image in $IMAGES; do
            docker tag "local/app:${GITHUB_SHA}" "$image:${GITHUB_SHA}"
            docker push "$image:${GITHUB_SHA}"
            DIGEST="$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$image:${GITHUB_SHA}" \
              | grep "^$image@" | cut -d@ -f2)"
            echo "$DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
            echo "Deploy pinned image: \`$image@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
            echo "LAST_REF=$image@$DIGEST" >> "$GITHUB_ENV"
          done
      - name: SBOM for the pushed image
        run: trivy image --format cyclonedx --output sbom-app.cdx.json "$LAST_REF"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom-app
          path: sbom-app.cdx.json
          retention-days: 90
      - name: Logout
        if: always()
        run: docker logout ghcr.io || true
