name: Build and publish workload images
# Builds on a GitHub-hosted runner (no AWS or admin credentials on the build
# host), gates on a Trivy image scan, pushes to the shared GHCR namespace in
# config/images.json, and records the immutable digest plus an SBOM.
# Deploy only the printed digest; tags are for humans.
on:
  push:
    branches: [dev]
    paths:
      - 'workloads/**'
      - 'containers/**'
      - 'config/images.json'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [resume-smoke, robot-sim-worker]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve image name from config/images.json
        env:
          NAME: ${{ matrix.image }}
        run: |
          python3 - <<'PY'
          import json, os
          config = json.load(open("config/images.json"))
          spec = config["images"][os.environ["NAME"]]
          assert spec["owner"] == "robot_controller", "image is built by another repository"
          registry = config["registry"]
          assert registry == registry.lower(), "GHCR names must be lowercase"
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"IMAGE={registry}/{os.environ['NAME']}\n")
              env.write(f"DOCKERFILE={spec['dockerfile']}\n")
          PY
      - name: Install pinned, checksum-verified Trivy
        run: bash scripts/install_trivy.sh
      - name: Build
        run: |
          docker build --pull -f "$DOCKERFILE" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE:${GITHUB_SHA}" .
      - name: Trivy gate (fixable HIGH/CRITICAL)
        run: |
          trivy image --scanners vuln,secret --ignorefile .trivyignore \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:${GITHUB_SHA}"
      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA}"
      - name: Resolve immutable digest
        run: |
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${GITHUB_SHA}" | cut -d@ -f2)"
          echo "$DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "Deploy pinned image: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - name: SBOM for the pushed image
        run: trivy image --format cyclonedx --output "sbom-${{ matrix.image }}.cdx.json" "$IMAGE@$DIGEST"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json
          retention-days: 90
      - name: Logout
        if: always()
        run: docker logout ghcr.io || true
