apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: robot-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KhoaDang-Dinh/robot_controller.git
    targetRevision: dev
    path: k8s/charts/robot-controller
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: robot-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

