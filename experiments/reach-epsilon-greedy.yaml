# Template for trying a new idea: copy this file, change the policy and params.
# Per-shard seeds make shards independent replicas for variance estimates.
schema_version: 1
name: reach-epsilon-greedy
description: Example learning run; epsilon-greedy policy on the 1-D reach task.
adapter:
  name: smoke
  params:
    target_position: 10
    step_seconds: 0.1
    max_episode_steps: 50
policy:
  name: epsilon_greedy
  params:
    epsilon: 0.5
    epsilon_min: 0.05
    decay: 0.95
seeds: [1, 2, 3, 4]
shards: 4
parallelism: 4
target_steps: 2000
checkpoint_interval_seconds: 60
limits:
  max_gpus: 4
  gpus_per_shard: 1
  active_deadline_seconds: 3600
resume:
  allow_config_change: false
