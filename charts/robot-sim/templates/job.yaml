{{- if .Values.enabled }}
{{- $exp := include "robot-sim.experiment" . | fromJson }}
{{- $id := required "job.id is required" .Values.job.id }}
{{- $digest := required "image.digest is required (sha256:...)" .Values.image.digest }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $id) }}{{ fail "job.id must be a DNS label using lowercase letters, digits and hyphens" }}{{ end }}
{{- if gt (len $id) 40 }}{{ fail "job.id must be at most 40 characters" }}{{ end }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $digest) }}{{ fail "image.digest must be a pinned sha256 digest" }}{{ end }}
{{- $registry := trimSuffix "/" .Values.image.allowedRegistry }}
{{- if not (hasPrefix (printf "%s/" $registry) .Values.image.repository) }}{{ fail (printf "image.repository must be under %s" $registry) }}{{ end }}
{{- if not (regexMatch "^[a-zA-Z0-9]([-_.a-zA-Z0-9]{0,61}[a-zA-Z0-9])?$" .Values.cost.costCenter) }}{{ fail "cost.costCenter must be a valid label value" }}{{ end }}
{{- if not (has .Values.scheduling.purchase (list "spot" "on-demand")) }}{{ fail "scheduling.purchase must be spot or on-demand" }}{{ end }}
{{- $gpus := int $exp.gpus }}
{{- $capacity := ternary .Values.scheduling.purchase "cpu" (gt $gpus 0) }}
{{- $configSha := substr 0 16 $exp.sha }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "robot-sim-%s" $id | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: robot-sim
    app.kubernetes.io/part-of: robot-sim
    robot-sim/job-id: {{ $id | quote }}
    robot-sim/experiment: {{ $exp.name | quote }}
    robot-sim/config-sha: {{ $configSha | quote }}
    robot-sim/cost-center: {{ .Values.cost.costCenter | quote }}
    robot-sim/capacity-type: {{ $capacity | quote }}
  annotations:
    robot-sim/config-sha256: {{ $exp.sha | quote }}
spec:
  completionMode: Indexed
  completions: {{ int $exp.shards }}
  parallelism: {{ int $exp.parallelism }}
  backoffLimit: {{ .Values.job.backoffLimit }}
  {{- if gt (int .Values.job.ttlSecondsAfterFinished) 0 }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  {{- end }}
  {{- if gt (int $exp.deadline) 0 }}
  activeDeadlineSeconds: {{ int $exp.deadline }}
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: robot-sim
        app.kubernetes.io/part-of: robot-sim
        robot-sim/job-id: {{ $id | quote }}
        robot-sim/experiment: {{ $exp.name | quote }}
        robot-sim/config-sha: {{ $configSha | quote }}
        robot-sim/cost-center: {{ .Values.cost.costCenter | quote }}
        robot-sim/capacity-type: {{ $capacity | quote }}
      annotations:
        # A changed experiment file is a new Pod spec, never an in-place edit.
        robot-sim/config-sha256: {{ $exp.sha | quote }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 110
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Prefer distinct VMs to reduce the impact of a single EC2 loss.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              robot-sim/job-id: {{ $id | quote }}
      {{- if gt $gpus 0 }}
      nodeSelector:
        robot-sim/node-class: gpu
        robot-sim/purchase: {{ .Values.scheduling.purchase | quote }}
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      {{- end }}
      containers:
        - name: simulation
          image: {{ printf "%s@%s" .Values.image.repository $digest | quote }}
          imagePullPolicy: IfNotPresent
          args: ["run"]
          env:
            - name: EXPERIMENT_FILE
              value: /etc/robot/experiment.yaml
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            - name: PLATFORM_PROJECT
              value: {{ .Values.platform.project | quote }}
            - name: PLATFORM_ENVIRONMENT
              value: {{ .Values.platform.environment | quote }}
            - name: JOB_ID
              value: {{ $id | quote }}
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: IMAGE_DIGEST
              value: {{ $digest | quote }}
            - name: GIT_REVISION
              value: {{ .Values.gitRevision | quote }}
            - name: HOME
              value: /work
            # Telemetry resource attributes (see core/telemetry.py).
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.observability.serviceName | quote }}
            - name: IMAGE_NAME
              value: {{ .Values.image.repository | quote }}
            - name: EXPERIMENT
              value: {{ $exp.name | quote }}
            - name: COST_CENTER
              value: {{ .Values.cost.costCenter | quote }}
            - name: CAPACITY_TYPE
              value: {{ $capacity | quote }}
            - name: GPU_COUNT
              value: {{ $gpus | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
              {{- if gt $gpus 0 }}
              nvidia.com/gpu: {{ $gpus }}
              {{- end }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
              {{- if gt $gpus 0 }}
              nvidia.com/gpu: {{ $gpus }}
              {{- end }}
          volumeMounts:
            - name: experiment
              mountPath: /etc/robot
              readOnly: true
            - name: scratch
              mountPath: /work
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: experiment
          configMap:
            name: {{ printf "robot-sim-%s-experiment" $id | quote }}
        - name: scratch
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
