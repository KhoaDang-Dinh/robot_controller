# Opt in explicitly: installing a GPU Job can incur significant cost.
enabled: false

job:
  id: ""
  shards: 1
  parallelism: 1
  targetSteps: 120
  stepSeconds: 1
  checkpointIntervalSeconds: 600
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 0
  # Covers a limited number of lost Pods, including Spot interruptions.
  backoffLimit: 15

# Optional strict, durable barrier at fixed simulation-step boundaries.
# All shards MUST have schedulable GPU capacity before enabling this mode.
synchronization:
  enabled: false
  everySteps: 10
  pollSeconds: 5
  timeoutSeconds: 1800

image:
  # Must live under allowedRegistry, the shared GHCR namespace recorded in
  # config/images.json and published by infra in the SSM contract.
  repository: ghcr.io/khoadang-dinh/robot-sim-worker
  allowedRegistry: ghcr.io/khoadang-dinh
  digest: ""
  pullSecrets: []

aws:
  region: ap-southeast-1

platform:
  project: robot-sim
  environment: dev

gitRevision: unknown

# Cost attribution and observability labels. They are applied to the Job and
# every Pod, and copied into each telemetry record, so usage can be grouped by
# experiment / cost centre and joined to node capacity type.
cost:
  experiment: ""      # defaults to job.id
  costCenter: thesis
observability:
  # Name reported as OpenTelemetry service.name.
  serviceName: robot-sim-worker

serviceAccount:
  name: robot-sim-worker

scheduling:
  # Must match a scaled-up EKS GPU node group.
  purchase: spot
  gpuPerPod: 1

resources:
  requests:
    cpu: "1000m"
    memory: "2Gi"
  limits:
    cpu: "4000m"
    memory: "8Gi"
