# Opt in explicitly: installing a GPU Job can incur significant cost.
enabled: false

# The experiment file, passed verbatim:
#   helm install ... --set-file experiment=experiments/<name>.yaml
# Shards, parallelism, GPUs per shard, deadline and barrier settings all come from
# this file; the chart only decides where and how the Pods run.
experiment: ""

job:
  # Run id (a DNS label, <= 40 chars). Reuse it only to resume the same run.
  id: ""
  ttlSecondsAfterFinished: 86400
  # Covers a limited number of lost Pods, including Spot interruptions.
  backoffLimit: 15

image:
  # Must live under allowedRegistry, the shared GHCR namespace recorded in
  # config/images.json and published by infra in the SSM contract.
  repository: ghcr.io/khoadang-dinh/robot-sim-worker
  allowedRegistry: ghcr.io/khoadang-dinh
  digest: ""
  pullSecrets: []

aws:
  region: ap-southeast-1

platform:
  project: robot-sim
  environment: dev

gitRevision: unknown

# Cost attribution: the experiment name (from the file) and this cost centre are
# applied as labels to the Job and every Pod and copied into each telemetry record.
cost:
  costCenter: thesis
observability:
  # Name reported as OpenTelemetry service.name.
  serviceName: robot-sim-worker

serviceAccount:
  name: robot-sim-worker

scheduling:
  # Must match a scaled-up EKS GPU node group. Ignored for CPU-only experiments
  # (limits.gpus_per_shard: 0).
  purchase: spot

# Isaac Lab experiments (adapter: isaaclab) run the Isaac Sim based image as its
# rootless user (1234) with writable caches. Requires accepting the NVIDIA
# Omniverse License Agreement explicitly; privacy/data-collection consent is never set.
isaacsim:
  acceptEula: false
  repositorySuffix: /robot-sim-isaaclab
  shmSize: 4Gi
  # Shader/kit caches are rebuilt on every Pod start unless a PVC is provided.
  cachePvc: ""
  resources:
    requests:
      cpu: "3000m"
      memory: "12Gi"
    limits:
      cpu: "8000m"
      memory: "28Gi"

resources:
  requests:
    cpu: "1000m"
    memory: "2Gi"
  limits:
    cpu: "4000m"
    memory: "8Gi"
